name: NIFTY AI Trading V16 - ZIP Auto Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Find V16 ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract V16 project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir extracted

          unzip -q "$ZIP_FILE" -d extracted

          PUBSPEC=$(find extracted -type f -name "pubspec.yaml" -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found inside ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project found at: $PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. .

          test -f pubspec.yaml
          test -d lib

          echo "Flutter project extracted successfully."

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          rm -rf android

          flutter create \
            --platforms=android \
            --org com.virajworks \
            --project-name nifty_ai_trading .

      - name: Flutter dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Build Release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NIFTY-V16-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
